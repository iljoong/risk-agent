[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "business-skill-chat"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "agent-framework-github-copilot",
  "azure-identity",
  "aiohttp",
  "fastapi",
  "uvicorn",
  "pydantic>=2",
  "python-multipart",
  "python-dotenv",
  "pypdf",
  "sqlalchemy>=2",
  "alembic",
  "pyyaml",
  "beautifulsoup4",
  "tinycss2",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "reportlab", "types-PyYAML", "types-beautifulsoup4", "httpx2"]

[tool.hatch.build.targets.wheel]
packages = ["src/skill_chat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: explicit opt-in tests requiring configured Foundry resources", "runtime: opt-in real local Copilot SDK/CLI tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
